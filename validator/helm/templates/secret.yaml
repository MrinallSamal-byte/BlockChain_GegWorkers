apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vgdp-validator.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "vgdp-validator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
